<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2473B8">
  <title>Сторінку не знайдено | Українська Молодь - Христові</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232473B8'/%3E%3Crect x='28' y='12' width='8' height='40' rx='2' fill='%23fff'/%3E%3Crect x='16' y='24' width='32' height='8' rx='2' fill='%235EC1CA'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap&subset=cyrillic" rel="stylesheet">
  <script>try{var t=localStorage.getItem("umh-theme");if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <style>
    :root { color-scheme: light; --cyan: #5EC1CA; --blue: #2473B8; --page: #2473B8; --card: #FFFFFF; --border: #E0F0F2; --text: #11363C; --muted: #5C8187; --shadow: 0 12px 32px rgba(94, 193, 202, 0.15); }
    :root[data-theme="dark"] { color-scheme: dark; --blue: #6FB1F0; --page: #0F2236; --card: #172B40; --border: #264059; --text: #E6F1F3; --muted: #93B4BA; --shadow: 0 12px 32px rgba(0, 0, 0, 0.35); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; background: var(--page); color: var(--text); font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
    .card { width: 100%; max-width: 420px; padding: 32px 24px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); }
    .code { font-size: 4rem; font-weight: 900; line-height: 1; color: var(--cyan); }
    h1 { margin: 12px 0 8px; font-size: 1.4rem; font-weight: 900; color: var(--blue); }
    p { margin-bottom: 24px; font-size: 0.95rem; color: var(--muted); }
    .btn { display: inline-block; width: 100%; padding: 14px 20px; border-radius: 16px; background: var(--cyan); color: #FFFFFF; font-size: 1rem; font-weight: 800; text-decoration: none; }
    .btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Тут нічого немає</h1>
    <p>Схоже, такої сторінки не існує. Повернись на головну, там розклад зустрічей і все найважливіше.</p>
    <a class="btn" href="/">На головну</a>
  </main>
</body>
</html>
